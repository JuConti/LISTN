<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LISTN — Share this piece</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:    #c0392b;
      --blue:   #9ed5de;
      --green:  #265e55;
      --purple: #7b5ea7;
      --black:  #1f1f22;
      --white:  #f9f6f0;
      --grey:   #2e2e32;
      --mid:    #888;
      --dim:    #444;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      overflow-x: hidden;
      cursor: none;
      min-height: 100vh;
    }

    /* ── CURSOR ── */
    .cursor { position:fixed; width:10px; height:10px; background:var(--white); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .3s, height .3s; mix-blend-mode:difference; }
    .cursor-ring { position:fixed; width:38px; height:38px; border:1px solid rgba(249,246,240,.35); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:width .3s, height .3s, opacity .3s; }

    /* ── NOISE ── */
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:1000; opacity:.3; }

    /* ── NAV ── */
    nav { position:fixed; top:0; left:0; right:0; z-index:500; display:flex; align-items:center; justify-content:space-between; padding:24px 40px; mix-blend-mode:difference; }
    .nav-logo img { height:28px; width:auto; display:block; filter:brightness(0) invert(1); }
    .nav-right { display:flex; gap:40px; align-items:center; }
    .nav-link { font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:.45; transition:opacity .3s; }
    .nav-link:hover, .nav-link.active { opacity:1; }
    .nav-back { display:flex; align-items:center; gap:10px; }
    .nav-back svg { opacity:.45; transition:opacity .3s; }
    .nav-back:hover svg { opacity:1; }

    /* ── MAIN LAYOUT ── */
    .share-layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      min-height: 100vh;
    }

    /* ── ARTWORK PANEL ── */
    .artwork-panel {
      position: relative;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 100vh;
    }
    .artwork-bg-blur {
      position: absolute; inset: -40px;
      background: var(--artwork-bg, linear-gradient(135deg,#060310,#180d2e,#0d0718));
      filter: blur(60px) brightness(.4);
      transform: scale(1.2);
    }
    .artwork-canvas-wrap {
      position: relative; z-index: 1;
      width: min(560px, 85%);
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }
    .artwork-display {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .artwork-display-div {
      width: 100%; height: 100%;
      background: linear-gradient(135deg,#060310,#180d2e,#0d0718);
    }
    .artwork-emotion-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--purple);
    }

    /* Top-left badge */
    .artwork-badge {
      position: absolute; top: 40px; left: 40px; z-index: 2;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; animation: fadeUp .9s ease .3s forwards;
    }
    .artwork-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); }
    .artwork-badge-label { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: rgba(249,246,240,.45); }

    /* ── SHARE PANEL ── */
    .share-panel {
      border-left: 1px solid var(--grey);
      display: flex;
      flex-direction: column;
      padding: 100px 48px 48px;
      overflow-y: auto;
    }

    .share-eyebrow {
      font-size: 10px; letter-spacing: .35em; text-transform: uppercase;
      color: var(--mid); margin-bottom: 20px;
      opacity: 0; animation: fadeUp .9s ease .2s forwards;
    }
    .share-title {
      font-size: clamp(32px, 3vw, 48px); font-weight: 900;
      letter-spacing: -.03em; text-transform: uppercase; line-height: .9;
      color: var(--white); margin-bottom: 10px;
      opacity: 0; animation: fadeUp .9s ease .35s forwards;
    }
    .share-piece-meta {
      font-size: 12px; color: var(--mid); letter-spacing: .05em; margin-bottom: 40px;
      opacity: 0; animation: fadeUp .9s ease .45s forwards;
    }
    .share-piece-meta span { color: rgba(249,246,240,.5); }

    .share-divider {
      height: 1px; background: var(--grey); margin-bottom: 32px;
      opacity: 0; animation: fadeUp .9s ease .5s forwards;
    }

    /* Copy link */
    .copy-section {
      margin-bottom: 32px;
      opacity: 0; animation: fadeUp .9s ease .55s forwards;
    }
    .copy-label { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--mid); margin-bottom: 12px; display: block; }
    .copy-row { display: flex; gap: 0; }
    .copy-input {
      flex: 1; background: var(--grey); border: 1px solid #3a3a3f; border-right: none;
      padding: 14px 16px; color: var(--mid);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 12px; outline: none; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; letter-spacing: .03em;
    }
    .copy-btn {
      padding: 14px 20px; background: var(--white); color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10px; font-weight: 900; letter-spacing: .25em; text-transform: uppercase;
      border: 1px solid var(--white); cursor: none; transition: all .25s; white-space: nowrap;
      position: relative; overflow: hidden;
    }
    .copy-btn::after {
      content: ''; position: absolute; inset: 0; background: var(--black);
      transform: translateX(-101%); transition: transform .35s cubic-bezier(.76,0,.24,1);
    }
    .copy-btn:hover { color: var(--white); }
    .copy-btn:hover::after { transform: translateX(0); }
    .copy-btn span { position: relative; z-index: 1; }
    .copy-confirm {
      font-size: 11px; color: var(--green); letter-spacing: .1em; margin-top: 8px;
      opacity: 0; transition: opacity .3s; height: 16px;
    }
    .copy-confirm.visible { opacity: 1; }

    /* Send to friends */
    .send-section {
      margin-bottom: 32px;
      opacity: 0; animation: fadeUp .9s ease .63s forwards;
    }
    .send-label { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--mid); margin-bottom: 12px; display: block; }

    .friends-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .friend-card {
      padding: 14px 8px 12px;
      border: 1px solid #3a3a3f;
      background: transparent;
      cursor: none;
      transition: border-color .2s ease, background .2s ease;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative;
    }
    .friend-card:hover { border-color: rgba(249,246,240,.18); }
    .friend-card.selected { border-color: var(--white); background: rgba(249,246,240,.04); }
    .friend-card.selected .friend-check { opacity: 1; }
    .friend-avatar {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    }
    .friend-avatar-inner { width: 100%; height: 100%; }
    .friend-name { font-size: 11px; font-weight: 500; color: var(--white); letter-spacing: .03em; }
    .friend-handle { font-size: 10px; color: var(--mid); letter-spacing: .05em; }
    .friend-check {
      position: absolute; top: 6px; right: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--white); display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .friend-check svg { display: block; }

    .send-friends-btn {
      width: 100%; margin-top: 10px; padding: 14px;
      background: transparent; border: 1px solid #3a3a3f;
      color: var(--mid); font-family: inherit;
      font-size: 11px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase;
      cursor: none; transition: all .25s;
    }
    .send-friends-btn.has-selection { border-color: var(--white); color: var(--white); }
    .send-friends-btn.sent { border-color: var(--green); color: var(--green); }

    /* Social share */
    .social-section {
      margin-bottom: 40px;
      opacity: 0; animation: fadeUp .9s ease .72s forwards;
    }
    .social-label { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--mid); margin-bottom: 12px; display: block; }
    .social-row { display: flex; gap: 8px; }
    .social-share-btn {
      flex: 1; padding: 13px 16px; background: transparent; border: 1px solid #3a3a3f;
      color: var(--mid); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: .15em; text-transform: uppercase;
      cursor: none; transition: all .25s; display: flex; align-items: center;
      justify-content: center; gap: 8px; text-decoration: none;
    }
    .social-share-btn:hover { border-color: rgba(249,246,240,.25); color: var(--white); }

    /* Download */
    .download-btn {
      width: 100%; padding: 16px; background: transparent; border: 1px solid #3a3a3f;
      color: var(--mid); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase;
      cursor: none; transition: all .25s; margin-bottom: 40px; display: flex;
      align-items: center; justify-content: center; gap: 10px;
      opacity: 0; animation: fadeUp .9s ease .8s forwards;
    }
    .download-btn:hover { border-color: rgba(249,246,240,.25); color: var(--white); }

    /* Proof + CTA */
    .proof-strip {
      margin-top: auto; padding-top: 32px; border-top: 1px solid var(--grey);
      opacity: 0; animation: fadeUp .9s ease .9s forwards;
    }
    .proof-count {
      font-size: 11px; color: var(--mid); letter-spacing: .1em; margin-bottom: 20px;
    }
    .proof-count strong { color: var(--white); }
    .cta-btn {
      display: block; width: 100%; padding: 18px; background: var(--white); color: var(--black);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 12px; font-weight: 900; letter-spacing: .3em; text-transform: uppercase;
      text-decoration: none; text-align: center; cursor: none;
      position: relative; overflow: hidden; transition: color .3s;
    }
    .cta-btn::after {
      content: ''; position: absolute; inset: 0; background: var(--black);
      transform: translateX(-101%); transition: transform .42s cubic-bezier(.76,0,.24,1);
    }
    .cta-btn:hover { color: var(--white); }
    .cta-btn:hover::after { transform: translateX(0); }
    .cta-btn span { position: relative; z-index: 1; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>

  <script>
    // ── CURSOR ──
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
    (function animRing(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);})();

    // ── EMOTION COLORS ──
    const emotionColors = { intensity:'#c0392b', calm:'#9ed5de', balance:'#265e55', ambiguity:'#7b5ea7' };
    const emotionNames  = { intensity:'Intensity', calm:'Calm', balance:'Balance', ambiguity:'Ambiguity' };
    const emotionGradients = {
      intensity: 'linear-gradient(135deg,#080000,#1e0404,#0c0101)',
      calm:      'linear-gradient(155deg,#020a0d,#0c1f25,#061318)',
      balance:   'linear-gradient(145deg,#020604,#091a10,#030c06)',
      ambiguity: 'linear-gradient(135deg,#060310,#180d2e,#0d0718)',
    };

    // ── LOAD PIECE DATA ──
    // Reads from localStorage if the user just generated something in index.html,
    // otherwise falls back to a demo piece from URL params or default.
    function loadPiece() {
      // Try localStorage (set by the generate flow in index.html)
      let piece = null;
      try { piece = JSON.parse(localStorage.getItem('listn_share_piece')); } catch(e) {}

      // Try URL params
      if (!piece) {
        const params = new URLSearchParams(location.search);
        if (params.get('emotion')) {
          piece = {
            emotion: params.get('emotion') || 'ambiguity',
            title:   params.get('title')   || 'Between Worlds',
            author:  params.get('author')  || '@julia_c',
            time:    params.get('time')    || 'just now',
            image:   params.get('image')   || null,
          };
        }
      }

      // Default demo
      if (!piece) {
        piece = { emotion:'ambiguity', title:'Between Worlds', author:'@julia_c', time:'just now', image:null };
      }

      return piece;
    }

    function applyPiece(piece) {
      const color = emotionColors[piece.emotion] || emotionColors.ambiguity;
      const grad  = emotionGradients[piece.emotion] || emotionGradients.ambiguity;

      // Artwork display
      document.getElementById('artworkEmotionBar').style.background = color;
      document.getElementById('artworkBadgeDot').style.background   = color;
      document.getElementById('artworkBadgeLabel').textContent       = emotionNames[piece.emotion] || piece.emotion;
      document.querySelector('.artwork-bg-blur').style.background    = grad;
      document.getElementById('artworkDiv').style.background         = grad;

      // Display artwork: imageUrl = ImageKit URL (from profile), image = base64 (from generator)
      const artDiv    = document.getElementById('artworkDiv');
      const artCanvas = document.getElementById('artworkCanvas');

      if (piece.imageUrl) {
        // Show as <img> tag
        const imgEl = document.createElement('img');
        imgEl.src = piece.imageUrl;
        imgEl.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        artDiv.replaceWith(imgEl);
      } else if (piece.image) {
        // Canvas base64 from the generator
        const img = new Image();
        img.src = piece.image;
        img.onload = () => {
          artCanvas.width  = img.naturalWidth;
          artCanvas.height = img.naturalHeight;
          artCanvas.getContext('2d').drawImage(img, 0, 0);
          artCanvas.style.display = 'block';
          artDiv.style.display = 'none';
        };
      }

      // Panel text
      const titleWords = piece.title.split(' ');
      const mid = Math.ceil(titleWords.length / 2);
      document.getElementById('shareTitle').innerHTML =
        titleWords.slice(0, mid).join(' ') + '<br>' + (titleWords.slice(mid).join(' ') || '') + '.';

      document.getElementById('shareAuthor').textContent  = piece.author;
      document.getElementById('shareEmotion').textContent = emotionNames[piece.emotion] || piece.emotion;
      document.getElementById('shareTime').textContent    = piece.time;

      // Share URL
      const slug = piece.title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
      document.getElementById('shareUrl').textContent = 'listn.art/p/' + slug;
      document.getElementById('shareUrl').dataset.url = 'https://listn.art/p/' + slug;
    }

    applyPiece(loadPiece());

    // ── COPY LINK ──
    document.getElementById('copyBtn').addEventListener('click', () => {
      const url = document.getElementById('shareUrl').dataset.url || document.getElementById('shareUrl').textContent;
      navigator.clipboard.writeText(url).catch(() => {});
      const confirm = document.getElementById('copyConfirm');
      confirm.classList.add('visible');
      setTimeout(() => confirm.classList.remove('visible'), 2800);
    });

    // ── FRIENDS SELECTOR ──
    const sendBtn = document.getElementById('sendFriendsBtn');

    function updateSendBtn() {
      const selected = document.querySelectorAll('.friend-card.selected');
      const n = selected.length;
      if (n === 0) {
        sendBtn.textContent = 'Select friends to send';
        sendBtn.classList.remove('has-selection', 'sent');
      } else {
        sendBtn.textContent = 'Send to ' + n + ' friend' + (n > 1 ? 's' : '') + ' ↗';
        sendBtn.classList.add('has-selection');
        sendBtn.classList.remove('sent');
      }
    }

    document.querySelectorAll('.friend-card').forEach(card => {
      card.addEventListener('click', () => {
        card.classList.toggle('selected');
        updateSendBtn();
      });
    });

    sendBtn.addEventListener('click', () => {
      const selected = document.querySelectorAll('.friend-card.selected');
      if (selected.length === 0) return;
      // Simulate send
      sendBtn.textContent = 'Sent ✓';
      sendBtn.classList.remove('has-selection');
      sendBtn.classList.add('sent');
      selected.forEach(c => c.classList.remove('selected'));
      setTimeout(updateSendBtn, 3000);
    });

    // ── DOWNLOAD ──
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const canvas  = document.getElementById('artworkCanvas');
      const imgEl   = document.querySelector('.artwork-canvas-wrap img');
      const piece   = (() => { try { return JSON.parse(localStorage.getItem('listn_share_piece')); } catch(e){ return null; } })();

      if (canvas && canvas.style.display !== 'none') {
        // Canvas (generated artwork)
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'listn-piece.png';
        a.click();
      } else if (piece && piece.imageUrl) {
        // ImageKit URL — open in new tab (cross-origin download)
        window.open(piece.imageUrl, '_blank');
      } else if (imgEl) {
        window.open(imgEl.src, '_blank');
      }
    });

    // ── PROOF COUNTER animate ──
    let count = 1284;
    setInterval(() => {
      if (Math.random() > .7) {
        count++;
        const el = document.getElementById('proofCount');
        if (el) el.textContent = count.toLocaleString();
      }
    }, 6000);
  </script>
</body>
</html>
